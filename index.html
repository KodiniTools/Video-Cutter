<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video schneiden online – kostenlos und verlustfrei | KodiniTools</title>
    <meta
      name="description"
      content="Videos online kürzen: Start und Ende setzen, verlustfrei schneiden oder framegenau neu kodieren, Bildausschnitt wählen. Kostenlos, ohne Registrierung."
    />
    <link rel="canonical" href="https://kodinitools.com/video-cutter/" />
    <link rel="alternate" hreflang="de" href="https://kodinitools.com/video-cutter/" />
    <link rel="alternate" hreflang="en" href="https://kodinitools.com/video-cutter/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://kodinitools.com/video-cutter/" />
    <link rel="icon" href="/public/favicon.ico" sizes="any" />

    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)" />

    <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
         damit Light-Nutzer keinen dunklen Flash sehen. Standard ist Light wie im
         Collage Maker; der Settings-Store (src/stores/settings.ts) übernimmt danach. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('theme')
        document.documentElement.setAttribute(
          'data-theme',
          storedTheme === 'dark' ? 'dark' : 'light',
        )
        var storedLocale = localStorage.getItem('locale')
        if (storedLocale === 'de' || storedLocale === 'en') {
          document.documentElement.setAttribute('lang', storedLocale)
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <!-- Globale KodiniTools-Partials per NGINX-SSI (wie im Collage Maker),
         siehe deploy/nginx-video-cutter.conf (ssi on). Im Vite-Dev-Server
         bleiben die Kommentare wirkungslos. -->
    <!--#include virtual="/partials/nav.html" -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--#include virtual="/partials/footer.html" -->
    <!--#include virtual="/partials/cookie-banner.html" -->
  </body>
</html>
