<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video schneiden – KodiniTools</title>
    <meta name="description" content="Videos schnell und einfach schneiden – KodiniTools." />
    <link rel="icon" href="/public/favicon.ico" sizes="any" />

    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)" />

    <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
         damit Light-Nutzer keinen dunklen Flash sehen. Standard ist Light wie im
         Collage Maker; der Settings-Store (src/stores/settings.ts) übernimmt danach. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('theme')
        document.documentElement.setAttribute(
          'data-theme',
          storedTheme === 'dark' ? 'dark' : 'light',
        )
        var storedLocale = localStorage.getItem('locale')
        if (storedLocale === 'de' || storedLocale === 'en') {
          document.documentElement.setAttribute('lang', storedLocale)
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>

    <!-- Google Consent Mode v2 - DSGVO/GDPR Compliant -->
    <script>
      // Initialize dataLayer and set default consent to denied
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }

      // Set default consent state - all denied until user accepts
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500,
      })

      // Load saved consent from localStorage
      ;(function () {
        try {
          var savedConsent = localStorage.getItem('cookieConsent')
          if (savedConsent) {
            var consent = JSON.parse(savedConsent)
            if (consent.analytics) {
              gtag('consent', 'update', {
                analytics_storage: 'granted',
                functionality_storage: 'granted',
                personalization_storage: 'granted',
              })
            }
            if (consent.marketing) {
              gtag('consent', 'update', {
                ad_storage: 'granted',
                ad_user_data: 'granted',
                ad_personalization: 'granted',
              })
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- Globale KodiniTools-Partials per NGINX-SSI (wie im Collage Maker),
         siehe deploy/nginx-video-cutter.conf (ssi on). Im Vite-Dev-Server
         bleiben die Kommentare wirkungslos. -->
    <!--#include virtual="/partials/nav.html" -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--#include virtual="/partials/footer.html" -->
    <!--#include virtual="/partials/cookie-banner.html" -->
  </body>
</html>
