# Video-Cutter (Client-seitig, FFmpeg.wasm) – als Unterverzeichnis
#
# Build:  VITE_BASE=/videoschneiden/ npm run build
# Upload: dist/  ->  /var/www/kodinitools/videoschneiden/
#
# In den bestehenden server{}-Block von kodinitools.com einfügen:

location /videoschneiden/ {
    alias /var/www/kodinitools/videoschneiden/;
    index index.html;
    try_files $uri $uri/ /videoschneiden/index.html;

    # Pflicht für FFmpeg.wasm (cross-origin isolation).
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    # Selbst gehostete Assets dürfen eingebettet werden.
    add_header Cross-Origin-Resource-Policy "same-origin"   always;

    # .wasm korrekt ausliefern (MIME-Type).
    types { application/wasm wasm; }

    # Gehashte Vite-Assets aggressiv cachen.
    location ~* /videoschneiden/assets/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Hinweis Cloudflare:
#   COOP/COEP-Header müssen bis zum Browser durchkommen.
#   Falls Cloudflare Header entfernt: über "Transform Rules" -> "Response Header"
#   erneut setzen, oder die Seite via Page Rule "Cache Level: Bypass" testen.
