# Video-Cutter (Client-seitig, FFmpeg.wasm) – als Unterverzeichnis
#
# Build:  siehe deploy/deploy.sh   (VITE_BASE=/video-cutter/ …)
# Ziel:   /var/www/kodinitools.com/video-cutter/
#
# In den bestehenden server{}-Block von kodinitools.com einfügen:

location /video-cutter/ {
    alias /var/www/kodinitools.com/video-cutter/;
    index index.html;
    try_files $uri $uri/ /video-cutter/index.html;

    # Pflicht für FFmpeg.wasm (cross-origin isolation) – ohne diese Header
    # bleibt die Engine bei "Engine wird geladen …" hängen.
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    # Selbst gehostete Assets dürfen eingebettet werden.
    add_header Cross-Origin-Resource-Policy "same-origin"   always;

    # .wasm korrekt ausliefern (MIME-Type).
    types { application/wasm wasm; }

    # Gehashte Vite-Assets aggressiv cachen.
    location ~* /video-cutter/assets/ {
        # add_header wird NICHT vererbt, sobald ein Block eigene add_header hat
        # -> hier erneut setzen.
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"   always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Hinweis Cloudflare:
#   COOP/COEP-Header müssen bis zum Browser durchkommen.
#   Falls Cloudflare Header entfernt: über "Transform Rules" -> "Response Header"
#   erneut setzen, oder die Seite via Page Rule "Cache Level: Bypass" testen.
#   Prüfen in der Browser-Konsole:  self.crossOriginIsolated === true
