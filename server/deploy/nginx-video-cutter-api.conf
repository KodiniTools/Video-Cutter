# Reverse-Proxy: /video-cutter/api/  ->  127.0.0.1:9015/api/
# (nur nötig für den serverseitigen Schnitt; das Backend muss via PM2 laufen.)
#
# Große Uploads:
#   - client_max_body_size muss >= der größten Datei sein. Wird es überschritten,
#     antwortet Nginx mit 413 und resettet den HTTP/2-Stream -> im Browser als
#     ERR_HTTP2_PROTOCOL_ERROR sichtbar. Hier 8g; bei Bedarf anheben.
#   - proxy_request_buffering off: Upload wird direkt zum Backend gestreamt
#     (wie beim funktionierenden /videokonverter/-Block). Das Backend entschärft
#     dafür die Node-Timeouts (requestTimeout=0), sonst würde ein langsamer
#     Upload nach 5 min mit "connection reset" abgebrochen.
#   - proxy_buffering off: SSE-Fortschritt (/cut/:id/events) läuft ungepuffert.
#
# Auf kodinitools.com liegt dieser Block in /etc/nginx/snippets/video-cutter.conf
# und wird im server{}-Block via "include" eingebunden.
# "^~" sorgt dafür, dass dieser Pfad Vorrang vor dem SPA-Block hat.
# Der Backend-PORT (server/.env -> PORT) MUSS mit dem hier genutzten Port (9015)
# übereinstimmen; MAX_FILE_SIZE_MB (server/.env) sollte zu client_max_body_size passen.

location ^~ /video-cutter/api/ {
    client_max_body_size 8g;
    proxy_request_buffering off;
    proxy_buffering        off;
    client_body_timeout    3600s;
    proxy_buffer_size      128k;
    proxy_buffers          8 128k;
    proxy_busy_buffers_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    rewrite ^/video-cutter/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:9015;
}

# Cloudflare-Hinweis:
#   Für /video-cutter/api/* eine Page Rule / Cache Rule "Cache: Bypass" setzen,
#   damit SSE-Streams und Uploads nicht zwischengespeichert werden.
