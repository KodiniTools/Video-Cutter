# Reverse-Proxy: /video-cutter/api/  ->  127.0.0.1:9015/api/
# (nur nötig für den serverseitigen Schnitt; das Backend muss via PM2 laufen.)
#
# WICHTIG bei großen Uploads über HTTP/2:
#   proxy_request_buffering ON. Große Uploads (0,5–2 GB) über HTTP/2 mit
#   request-buffering OFF brechen sonst mit ERR_HTTP2_PROTOCOL_ERROR ab.
#   Mit "on" nimmt Nginx den Upload komplett an (volle Netzgeschwindigkeit) und
#   reicht ihn danach ans Backend weiter -> stabil und gefühlt schneller.
#   proxy_buffering bleibt OFF, damit der SSE-Fortschritt (/cut/:id/events)
#   ungepuffert durchläuft.
#
# Auf kodinitools.com liegt dieser Block in /etc/nginx/snippets/video-cutter.conf
# und wird im server{}-Block via "include" eingebunden.
# "^~" sorgt dafür, dass dieser Pfad Vorrang vor dem SPA-Block hat.
# Der Backend-PORT (server/.env -> PORT) MUSS mit dem hier genutzten Port (9015)
# übereinstimmen.

location ^~ /video-cutter/api/ {
    client_max_body_size 2200m;
    proxy_request_buffering on;
    proxy_buffering        off;
    client_body_timeout    3600s;
    proxy_buffer_size      128k;
    proxy_buffers          8 128k;
    proxy_busy_buffers_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    rewrite ^/video-cutter/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:9015;
}

# Cloudflare-Hinweis:
#   Für /video-cutter/api/* eine Page Rule / Cache Rule "Cache: Bypass" setzen,
#   damit SSE-Streams und Uploads nicht zwischengespeichert werden.
