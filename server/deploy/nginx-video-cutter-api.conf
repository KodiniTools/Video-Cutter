# Reverse-Proxy: /video-cutter/api/  ->  127.0.0.1:9015/api/
# (nur nötig für den Modus "Auf dem Server"; das Backend muss via PM2 laufen.)
# Der Backend-PORT (server/.env) MUSS mit dem hier genutzten Port (9015)
# übereinstimmen – sonst: ERR_HTTP2_PROTOCOL_ERROR auf /video-cutter/api/cut.
#
# Auf kodinitools.com liegt dieser Block in /etc/nginx/snippets/video-cutter.conf
# und wird im server{}-Block via "include" eingebunden.
# "^~" sorgt dafür, dass dieser Pfad Vorrang vor dem SPA-Block hat.

location ^~ /video-cutter/api/ {
    include /etc/nginx/snippets/kodini-proxy-common.conf;
    proxy_buffering        off;
    proxy_request_buffering off;
    client_body_timeout    3600s;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;

    # Große Uploads erlauben (etwas über MAX_FILE_SIZE_MB).
    client_max_body_size 2200m;

    rewrite ^/video-cutter/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:9015;

    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
}

# Cloudflare-Hinweis:
#   Für /video-cutter/api/* eine Page Rule / Cache Rule "Cache: Bypass" setzen,
#   damit SSE-Streams und Uploads nicht zwischengespeichert werden.
