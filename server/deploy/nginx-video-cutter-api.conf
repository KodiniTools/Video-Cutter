# Reverse-Proxy: /videoschneiden/api/  ->  127.0.0.1:4021/api/
# In den bestehenden server{}-Block von kodinitools.com einfügen.

location /videoschneiden/api/ {
    proxy_pass http://127.0.0.1:4021/api/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Große Uploads erlauben (etwas über MAX_FILE_SIZE_MB).
    client_max_body_size 2200m;

    # SSE + lange Encodes: kein Puffern, großzügige Timeouts.
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Cloudflare-Hinweis:
#   Für /videoschneiden/api/* eine Page Rule / Cache Rule "Cache: Bypass" setzen,
#   damit SSE-Streams und Uploads nicht zwischengespeichert werden.
